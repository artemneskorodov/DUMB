name: Benchmarks

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip graphviz
          pip3 install -r ${{ github.workspace }}/requirements.txt

      - name: Build
        run: |
          cmake -B build
          cmake --build build -j

      - name: Run benchmarks
        run: |
          echo "Running tests..."
          mkdir benchmarks_build
          start=$(date +%s%N)

          ./build/dumb benchmarks/Addition.dumb benchmarks_build/Addition.s
          end=$(date +%s%N)
          t1=$(( (end - start)/1000000 ))

          start=$(date +%s%N)
          ./build/dumb benchmarks/IfCmpZero.dumb benchmarks_build/IfCmpZero.s
          end=$(date +%s%N)
          t2=$(( (end - start)/1000000 ))

          echo "TEST1=$t1" >> $GITHUB_ENV
          echo "TEST2=$t2" >> $GITHUB_ENV

      - name: Post benchmark to PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ⏱ Benchmark Results

            | Test | Before | After | Ratio |
            |------|--------|-------|-------|
            | test1 | 120 ms | 90 ms | 0.75 |
            | test2 | 200 ms | 150 ms | 0.75 |
          edit-mode: replace
