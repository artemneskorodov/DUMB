name: Benchmarks

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python script and save JSON
        id: run_script
        run: |
          python test/benchmark.py > result.json

      - name: Convert JSON to Markdown (dynamic columns)
        run: |
          echo "### 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          headers=$(jq -r '.columns | @tsv' result.json)

          echo "| $(echo $headers | tr '\t' ' | ') |" >> $GITHUB_STEP_SUMMARY

          echo "| $(echo $headers | sed 's/[^\t]*/---/g' | tr '\t' ' | ') |" >> $GITHUB_STEP_SUMMARY

          row=$(jq -r --argjson i $i '
            .columns as $cols
            | $cols
            | map(.[ $i ] as $v | getpath([.])[$i])
          ' result.json)

          for ((i=0; i<$rows; i++)); do
            row=$(jq -r --argjson i $i '
              to_entries
              | map(.value[$i])
              | @tsv
            ' result.json)

            echo "| $(echo $row | tr '\t' ' | ') |" >> $GITHUB_STEP_SUMMARY
          done
